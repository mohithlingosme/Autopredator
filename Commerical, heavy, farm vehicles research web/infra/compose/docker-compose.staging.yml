version: '3.8'

include:
  - docker-compose.base.yml

services:
  # Override for staging-specific settings if needed
  api:
    environment:
      - LOG_LEVEL=INFO
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  web:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  worker:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
