name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('backend/requirements*.txt', 'backend/pyproject.toml') != '' }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements*.txt
            backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Lint (ruff if installed)
        run: |
          python - <<'PY'
          import importlib.util
          import subprocess
          spec = importlib.util.find_spec("ruff")
          if spec:
              raise SystemExit(subprocess.call(["ruff", "check", "."]))
          print("ruff not installed; skipping")
          PY

      - name: Tests (pytest if installed)
        env:
          ENV: test
        run: |
          python - <<'PY'
          import importlib.util
          import subprocess
          import sys
          from pathlib import Path

          has_pytest = importlib.util.find_spec("pytest") is not None
          has_tests_dir = Path("tests").exists()
          if has_pytest and has_tests_dir:
              raise SystemExit(subprocess.call(["pytest", "-q"]))
          if has_pytest:
              print("pytest installed but no tests/ directory; skipping")
          else:
              print("pytest not installed; skipping")
          PY

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package-lock.json', 'frontend/pnpm-lock.yaml', 'frontend/yarn.lock', 'frontend/package.json') != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build --if-present

  php:
    name: PHP lint
    runs-on: ubuntu-latest
    if: ${{ hashFiles('**/*.php') != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Syntax check
        run: |
          set -e
          FILES=$(git ls-files '*.php')
          for f in $FILES; do php -l "$f" >/dev/null; done
          echo "PHP syntax OK"
