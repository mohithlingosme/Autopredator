version: "3.9"

services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/owner/repo-backend:latest}
    # Override BACKEND_IMAGE in .env to match ghcr.io/<owner>/<repo>-backend:<tag>
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/owner/repo-frontend:latest}
    # Override FRONTEND_IMAGE in .env to match ghcr.io/<owner>/<repo>-frontend:<tag>
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: autopredator
