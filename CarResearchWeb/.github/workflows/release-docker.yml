name: Release Docker

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional image tag override (default uses ref_name or manual run number)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build metadata
        id: prep
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          DOCKERFILE="./Dockerfile"
          CONTEXT="."
          if [ ! -f "$DOCKERFILE" ]; then
            FOUND="$(find . -name 'Dockerfile' | head -n 1)"
            if [ -z "$FOUND" ]; then
              echo "Dockerfile not found" >&2
              exit 1
            fi
            DOCKERFILE="$FOUND"
            CONTEXT="$(dirname "$FOUND")"
          fi

          REPO_NAME="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${{ github.repository_owner }}/$REPO_NAME"

          VERSION="$REF_NAME"
          if [ -z "$VERSION" ]; then
            if [ -n "$INPUT_VERSION" ]; then
              VERSION="$INPUT_VERSION"
            else
              VERSION="manual-${GITHUB_RUN_NUMBER}"
            fi
          fi

          echo "dockerfile=$DOCKERFILE" >> "$GITHUB_OUTPUT"
          echo "context=$CONTEXT" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.prep.outputs.context }}
          file: ${{ steps.prep.outputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.prep.outputs.image }}:${{ steps.prep.outputs.version }}
            ${{ steps.prep.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
