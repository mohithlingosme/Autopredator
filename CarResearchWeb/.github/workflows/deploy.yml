name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH (docker compose)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # Example: your server has docker-compose.yml that uses IMAGE env var
            tmp_env="$(mktemp)"
            grep -v '^IMAGE=' .env 2>/dev/null > "$tmp_env" || true
            echo "IMAGE=${{ secrets.IMAGE }}" >> "$tmp_env"
            mv "$tmp_env" .env

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
