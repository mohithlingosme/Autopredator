version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "autopredator/frontend-team"
    assignees:
      - "autopredator/frontend-team"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"

  # Enable version updates for Python
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "autopredator/backend-team"
    assignees:
      - "autopredator/backend-team"
    commit-message:
      prefix: "deps"
      include: "scope"
