name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: false
        default: 'latest'

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SERVER_HOST_STAGING }}

      - name: Get latest tag
        id: get_tag
        run: |
          if [ "${{ inputs.tag }}" != "latest" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            # Get latest tag from GitHub API
            LATEST_TAG=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.tag_name')
            if [ "$LATEST_TAG" = "null" ]; then
              LATEST_TAG="latest"
            fi
            echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying ${{ steps.get_tag.outputs.tag }} to staging..."
          ssh -o StrictHostKeyChecking=no deploy@${{ secrets.SERVER_HOST_STAGING }} << EOF
            set -e
            cd /opt/fleetcommand/configs
            ./infra/scripts/deploy.sh staging ${{ steps.get_tag.outputs.tag }}
          EOF

      - name: Health check
        run: |
          echo "🏥 Running health checks..."
          ssh -o StrictHostKeyChecking=no deploy@${{ secrets.SERVER_HOST_STAGING }} << 'EOF'
            set -e
            cd /opt/fleetcommand/configs
            ./infra/scripts/healthcheck.sh staging
          EOF

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Staging deployment successful!"
          # Add notification logic here (Slack, email, etc.)

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Staging deployment failed!"
          # Add notification logic here (Slack, email, etc.)
