name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      php: ${{ steps.filter.outputs.php }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            php:
              - '**/*.php'
              - 'CarResearchWeb/**'
              - 'php_app/**'

  backend:
    name: Backend (Python)
    needs: changes
    if: needs.changes.outputs.backend == 'true' && hashFiles('backend/**') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          set -e
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Ruff
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check .
          else
            echo "ruff not installed; skipping"
          fi

      - name: Black
        run: |
          if command -v black >/dev/null 2>&1; then
            black --check .
          else
            echo "black not installed; skipping"
          fi

      - name: Pytest
        run: |
          if python -m pytest --version >/dev/null 2>&1; then
            pytest
          else
            echo "pytest not installed; skipping"
          fi

  frontend:
    name: Frontend (Node)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' && hashFiles('frontend/**') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json found; skipping frontend job."
            exit 0
          fi
          npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found; skipping"
          fi

  php:
    name: PHP
    needs: changes
    if: needs.changes.outputs.php == 'true' && hashFiles('**/*.php') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP syntax check
        run: |
          mapfile -t files < <(git ls-files '*.php' 'CarResearchWeb/**/*.php' 'php_app/**/*.php')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No PHP files to lint."
            exit 0
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done
